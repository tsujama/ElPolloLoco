<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="style.css">
    <script src="./js/classes/drawableObject.class.js"></script>
    <script src="./js/classes/movableObject.class.js"></script>
    <script src="./js/classes/character.class.js"></script>
    <script src="./js/classes/chicken.class.js"></script>
    <script src="./js/classes/cloud.class.js"></script>
    <script src="./js/classes/vendingMachine.class.js"></script>
    <script src="./js/classes/backgroundObjects.class.js"></script>
    <script src="./js/classes/throwableObject.class.js"></script>
    <script src="./js/classes/coins.class.js"></script>
    <script src="./js/classes/statusbar.class.js"></script>
    <script src="./js/classes/world.class.js"></script>
    <script src="./js/classes/keyboard.class.js"></script>
    <script src="./js/classes/level.class.js"></script>
    <script src="./js/classes/endboss.class.js"></script>
    <script src="./js/levels/level1.js"></script>
    <script src="./js/game.js"></script>
</head>
<body>
    <h1>El Pollo Loco</h1>

    <div id="startScreen">
        <button id="startButton" onclick="startGame()">Spiel starten</button>
        <button id="controlsButton" onclick="showControls()">Steuerung</button>
        <button id="imprintButton" onclick="showImprint()">Impressum</button>
        
        <div id="imprintScreen">
            <h2>Impressum</h2>
            <p>Hier kommt später dein Impressum rein.</p>
            <button onclick="hideImprint()">Zurück</button>
        </div>

        <div id="controlsScreen">
            <h2>Steuerung</h2>
            <p>A / D – Laufen</p>
            <p>Leertaste – Springen</p>
            <p>F – Flasche werfen</p>
            <p>E – Flaschen kaufen</p>
            <button onclick="hideControls()">Zurück</button>
        </div>
    </div>

    <div id="gameOverScreen">
        <button onclick="restartGame()">Erneut spielen</button>
    </div>

    <canvas id="canvas" width="720" height="480"></canvas>

</body>
</html>
